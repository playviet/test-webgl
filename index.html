<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>Avatar builder</title>
    <style>
        html, body { height:100%; margin:0; background:#000; overflow:hidden; }
        :root { --vh: 100dvh; }

        #unity-container{
            position:fixed; inset:0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
            display:grid; place-items:center; background:#000;
        }
        #unity-canvas{ width:100vw; height:var(--vh); display:block; touch-action:none; }

        /* Splash with logo centered and loading bar at the bottom */
        #splash{
            position:fixed; inset:0; z-index:10;
            display:grid;
            grid-template-rows: 1fr auto;   /* logo in the free space, footer at bottom */
            justify-items:center; align-items:center;
            background:#0b0b0b;
            transition: opacity .4s ease;
        }
        #splash.hidden{ opacity:0; pointer-events:none; }

        #splash .logo{
            width:min(42vw,220px); height:auto; image-rendering:auto;
            filter: drop-shadow(0 6px 18px rgba(255,255,255,.08));
        }

        #loading-footer{
            width:100%;
            display:flex; flex-direction:column; align-items:center; gap:10px;
            padding: 14px 20px calc(200px + env(safe-area-inset-bottom));
        }
        #bar{
            width:min(90vw,520px); height:10px;
            border-radius:999px; background:#2a2a2a; overflow:hidden;
        }
        #bar > i{
            display:block; height:100%; width:0%;
            background:linear-gradient(90deg,#ffb36b,#ff6aa3);
            transition:width .12s linear;
        }
        #pct{
            font:500 12px/1.2 ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;
            color:#d8d8d8; opacity:.9;
        }

        #log{
            position:fixed; left:8px; bottom:8px; color:#f55;
            font:12px/1.4 monospace; white-space:pre-wrap;
        }
    </style>
</head>
<body>
<!-- Splash (logo centered, loading bar at bottom) -->
<div id="splash">
    <img class="logo" src="TemplateData/logo.png" alt="Logo"/>
    <div id="loading-footer">
        <div id="bar"><i id="fill"></i></div>
        <div id="pct">0%</div>
    </div>
</div>

<!-- Unity canvas -->
<div id="unity-container">
    <canvas id="unity-canvas" tabindex="0"></canvas>
</div>
<pre id="log"></pre>

<script>
    // --- Mobile dynamic viewport height fix ---
    function setVHVar() {
        const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVHVar();
    window.addEventListener('resize', setVHVar);
    window.visualViewport && window.visualViewport.addEventListener('resize', setVHVar);

    // === Project build name (no hashed filenames) ===
    const BUILD_NAME = "AvatarBuilder";

    const buildUrl  = "Build";
    const loaderUrl = `${buildUrl}/${BUILD_NAME}.loader.js`;

    const config = {
        dataUrl:       `${buildUrl}/${BUILD_NAME}.data.unityweb`,
        frameworkUrl:  `${buildUrl}/${BUILD_NAME}.framework.js.unityweb`,
        codeUrl:       `${buildUrl}/${BUILD_NAME}.wasm.unityweb`,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Company",
        productName: BUILD_NAME,
        productVersion: "1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    };

    const canvas = document.getElementById("unity-canvas");
    const splash = document.getElementById("splash");
    const fill   = document.getElementById("fill");
    const pctEl  = document.getElementById("pct");
    const logEl  = document.getElementById("log");
    const log = (m)=>{ logEl.textContent += m + "\n"; console.warn(m); };

    // Pre-flight: verify files exist (helps catch wrong names/paths quickly)
    function head(url){ return fetch(url,{method:"HEAD"}).then(r=>{ if(!r.ok) throw new Error(`${url} → ${r.status}`); }); }

    Promise.all([ head(loaderUrl), head(config.dataUrl), head(config.frameworkUrl), head(config.codeUrl) ])
        .then(()=>{
            const s = document.createElement("script");
            s.src = loaderUrl;
            s.onload = () => {
                if (typeof createUnityInstance !== "function") { log("Loader loaded but createUnityInstance is undefined."); return; }

                // Progress callback -> update bar & percentage
                createUnityInstance(canvas, config, (progress)=>{
                    const p = Math.floor(progress * 100);
                    fill.style.width = p + "%";
                    pctEl.textContent = p + "%";
                }).then(()=>{
                    // Hide splash after a short delay for a smoother transition
                    setTimeout(()=> splash.classList.add('hidden'), 300);
                }).catch(e => log("Unity init error: " + e));
            };
            s.onerror = () => log("Failed to load loader: " + loaderUrl);
            document.body.appendChild(s);
        })
        .catch(e => log("Missing or blocked build file: " + e.message));

</script>
</body>
</html>
